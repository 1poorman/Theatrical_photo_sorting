# Isolated CPU benchmark runner. Database data is mounted read-only for size accounting.
services:
  vector-benchmark:
    profiles: [benchmark]
    image: theatrical-photo-sorting:latest
    working_dir: /app
    entrypoint: [python, tools/benchmark_vector_store.py]
    cpus: 4
    mem_limit: 6g
    environment:
      PYTHONPATH: /app
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      TRANS_QDRANT_URL: http://qdrant:6333
      TRANS_ELASTIC_URL: http://elasticsearch:9200
      TRANS_ELASTIC_USER: elastic
      TRANS_ELASTIC_PASSWORD: ${DOCKER_ELASTIC_PASSWORD:-theatrical-local-password}
    volumes:
      - ./tools/benchmark_vector_store.py:/app/tools/benchmark_vector_store.py:ro
      - ./outputs:/app/outputs
      - qdrant_data:/benchmark/qdrant_storage:ro
