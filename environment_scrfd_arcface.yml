# Theatrical Photo Sorting conda 环境
# 创建：conda env create -f environment_scrfd_arcface.yml
# 说明：CUDA 运行时由 pip 的 torch/onnxruntime/tensorrt 轮子自带，
#       conda 层只需 python 基础环境；torch 需单独用 cu130 索引安装（见 requirements 头部说明）
name: face_scrfd_arcface
channels:
  - defaults
dependencies:
  - python=3.10
  - pip=26.1.2
  - setuptools
  - pip:
      - -r requirements_scrfd_arcface.txt
