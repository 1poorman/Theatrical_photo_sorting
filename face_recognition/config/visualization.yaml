visualization:
  colors:
    detection_box: [0, 255, 0]      # 检测框颜色 (BGR)
    recognition_box: [0, 255, 0]    # 识别框颜色
    unknown_box: [0, 0, 255]        # 未知人脸框颜色
    landmark_point: [0, 0, 255]     # 关键点颜色
  
  text:
    font_scale: 0.6
    thickness: 2
    text_color: [255, 255, 255]     # 文字颜色
    bg_color: [0, 0, 0]             # 文字背景颜色
  
  dashboard:
    output_size: [1280, 960]        # 仪表板输出大小
    show_detection: true
    show_recognition: true
    show_aligned_faces: true
  
  embedding_visualization:
    method: 'tsne'                  # ['tsne', 'pca', 'umap']
    figsize: [10, 8]
    colormap: 'tab20'
  
  similarity_matrix:
    figsize: [12, 10]
    colormap: 'YlOrRd'